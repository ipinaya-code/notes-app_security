# ============================================================
# FASE 1: HTTP SIN CIFRAR (puerto 80)
# Las credenciales viajan en texto plano -> capturables con
# Wireshark/tcpdump desde la máquina "atacante" en la misma red.
# ============================================================
server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass notes_php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\. {
        deny all;
    }
}
